[Service]
Environment="MIOPEN_FIND_MODE=2"
# gfx1201 (RDNA4) has no MLIR attention solutions yet - don't enable
# Environment="MIGRAPHX_MLIR_USE_SPECIFIC_OPS=attention"
Environment="TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1"

# Clear and re-set ExecStart to add flags
ExecStart=
ExecStart=/usr/bin/comfyui --base-directory %S/comfyui --database-url sqlite:///%S/comfyui/user/comfyui.db --listen 127.0.0.1 --port 8188 --use-pytorch-cross-attention --reserve-vram 0.9 --lowvram
